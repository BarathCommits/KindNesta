# Decap CMS
# Visit /admin on the published site (GitHub OAuth required — see DEPLOY.md)
#
# Product catalog is spreadsheet-edited:
#   data/psp-catalog.csv  ← open in Google Sheets / Excel
# See data/CATALOG.md for the full workflow.

backend:
  name: github
  repo: BarathCommits/KindNesta
  branch: main

media_folder: public/images/products/psp
public_folder: /images/products/psp

collections:
  - name: site-notes
    label: Site notes
    files:
      - name: catalog-help
        label: How to update the catalog
        file: data/CATALOG.md
        fields:
          - { label: Guide, name: body, widget: markdown }
