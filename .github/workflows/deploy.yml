name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Keep custom-domain HTTPS on after deploys when the cert is ready.
      - name: Ensure custom domain HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages=$(gh api "repos/${{ github.repository }}/pages")
          printf '%s\n' "$pages" | jq '{cname, https_enforced, https_certificate}'
          cname=$(printf '%s' "$pages" | jq -r '.cname // empty')
          state=$(printf '%s' "$pages" | jq -r '.https_certificate.state // empty')
          enforced=$(printf '%s' "$pages" | jq -r '.https_enforced')
          if [ "$cname" != "kindnesta.com" ]; then
            echo "Setting custom domain to kindnesta.com"
            printf '%s\n' '{"cname":"kindnesta.com","https_enforced":false}' \
              | gh api --method PUT "repos/${{ github.repository }}/pages" --input -
          fi
          if [ "$state" = "approved" ] && [ "$enforced" != "true" ]; then
            echo "Enforcing HTTPS"
            printf '%s\n' '{"cname":"kindnesta.com","https_enforced":true}' \
              | gh api --method PUT "repos/${{ github.repository }}/pages" --input -
          fi
