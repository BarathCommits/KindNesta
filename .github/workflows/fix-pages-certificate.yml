# Repair GitHub Pages custom-domain TLS when browsers show a *.github.io cert
# mismatch for kindnesta.com. Clears and re-adds the domain so Let's Encrypt
# provisioning runs again, then enables Enforce HTTPS.
name: Fix Pages SSL certificate

on:
  push:
    branches:
      - cursor/fix-pages-ssl-b834
    paths:
      - ".github/workflows/fix-pages-certificate.yml"
  workflow_dispatch:

permissions:
  pages: write
  contents: read

concurrency:
  group: pages-ssl-fix
  cancel-in-progress: false

jobs:
  reprovision-certificate:
    runs-on: ubuntu-latest
    steps:
      - name: Clear custom domain (restart cert flow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"cname":null,"https_enforced":false}' \
            | gh api --method PUT "repos/${{ github.repository }}/pages" --input -
          echo "Cleared custom domain."

      - name: Wait for Pages to settle
        run: sleep 20

      - name: Re-add kindnesta.com
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"cname":"kindnesta.com","https_enforced":false}' \
            | gh api --method PUT "repos/${{ github.repository }}/pages" --input -
          echo "Re-added custom domain kindnesta.com."

      - name: Wait for Let's Encrypt certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            payload=$(gh api "repos/${{ github.repository }}/pages")
            state=$(printf '%s' "$payload" | jq -r '.https_certificate.state // "missing"')
            domains=$(printf '%s' "$payload" | jq -r '.https_certificate.domains // [] | join(",")')
            echo "Attempt $i/60: certificate state=$state domains=$domains"
            case "$state" in
              approved)
                echo "Certificate approved."
                printf '%s\n' "$payload" | jq '{cname, https_enforced, https_certificate}'
                exit 0
                ;;
              errored|bad_authz)
                echo "Certificate provisioning failed with state=$state"
                printf '%s\n' "$payload" | jq .
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for certificate approval."
          gh api "repos/${{ github.repository }}/pages" | jq .
          exit 1

      - name: Enforce HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"cname":"kindnesta.com","https_enforced":true}' \
            | gh api --method PUT "repos/${{ github.repository }}/pages" --input -
          gh api "repos/${{ github.repository }}/pages" \
            | jq '{cname, https_enforced, https_certificate}'
